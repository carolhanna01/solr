      comments:
        comment:
        - '#text': <p>Simple patch.</p>
          '@author': rjernst
          '@created': Tue, 26 Aug 2014 15:31:14 +0000
          '@id': '14110830'
        - '#text': '<p>Why is the Tokenizer itsself not final. I looked into the history,
            you removed the final keyword, so it was final before.</p>


            <p>Was there a reason to remove it?</p>'
          '@author': thetaphi
          '@created': Tue, 26 Aug 2014 16:01:46 +0000
          '@id': '14110875'
        - '#text': <p>IIRC, I was adding <tt>Lucene43EdgeNGramTokenizer</tt>, which
            was almost exactly the same, and didn't want to duplicate it.  Here I
            just went the route that satisfies the assert. If you feel strongly, I
            can copy the impl and make it final.</p>
          '@author': rjernst
          '@created': Tue, 26 Aug 2014 16:12:36 +0000
          '@id': '14110886'
        - '#text': '<p>In my 4.10 checkout it looks like that:</p>


            <div class="code panel" style="border-width: 1px;"><div class="codeContent
            panelContent">

            <pre class="code-java"><span class="code-keyword">public</span> <span
            class="code-keyword">final</span> <span class="code-keyword">class </span>Lucene43EdgeNGramTokenizer
            <span class="code-keyword">extends</span> Tokenizer {

            <span class="code-keyword">public</span> <span class="code-keyword">class
            </span>Lucene43NGramTokenizer <span class="code-keyword">extends</span>
            Tokenizer {

            </pre>

            </div></div>


            <p>So it does not relate to each other.</p>


            <p>I know that EdgeNGramTokenizer extends NGramTokenizer, which explains
            the non-finalness.</p>'
          '@author': thetaphi
          '@created': Tue, 26 Aug 2014 16:28:16 +0000
          '@id': '14110902'
        - '#text': '<p>Ah I see: In 4.x its code duplication, in trunk it extends
            each other. We should fix that, too. But I am nervous about trunk, because
            it has no tests.</p>'
          '@author': thetaphi
          '@created': Tue, 26 Aug 2014 16:37:47 +0000
          '@id': '14110919'
        - '#text': <p>Ok, this new patch replicates branch_4x's <tt>Lucene43EdgeNGramTokenizer</tt>
            to trunk (minus the diffs like Reader and Version that are no longer there
            in trunk).  I think this should make the backport easy (so it will just
            be making <tt>Lucene43NGramTokenizer</tt> final).</p>
          '@author': rjernst
          '@created': Tue, 26 Aug 2014 19:21:18 +0000
          '@id': '14111169'
        - '#text': '<p>Commit 1620759 from <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=rjernst"
            class="user-hover" rel="rjernst">rjernst</a> in branch ''dev/trunk''<br/>

            [ <a href="https://svn.apache.org/r1620759" class="external-link" target="_blank"
            rel="nofollow noopener">https://svn.apache.org/r1620759</a> ]</p>


            <p><a href="https://issues.apache.org/jira/browse/LUCENE-5908" title="Assertion
            fails for Lucene43NGramTokenizer" class="issue-link" data-issue-key="LUCENE-5908"><del>LUCENE-5908</del></a>:
            Fix Lucene43NGramTokenizer to be final</p>'
          '@author': jira-bot
          '@created': Tue, 26 Aug 2014 23:17:51 +0000
          '@id': '14111537'
        - '#text': '<p>Commit 1620760 from <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=rjernst"
            class="user-hover" rel="rjernst">rjernst</a> in branch ''dev/branches/branch_4x''<br/>

            [ <a href="https://svn.apache.org/r1620760" class="external-link" target="_blank"
            rel="nofollow noopener">https://svn.apache.org/r1620760</a> ]</p>


            <p><a href="https://issues.apache.org/jira/browse/LUCENE-5908" title="Assertion
            fails for Lucene43NGramTokenizer" class="issue-link" data-issue-key="LUCENE-5908"><del>LUCENE-5908</del></a>:
            Fix Lucene43NGramTokenizer to be final (merge 1620759)</p>'
