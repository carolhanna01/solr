      description: "<p>PhraseQuery behaves quite inconsistently when the position\
        \ of the first term is greater than 0. Here is an example:</p>\n\n<div class=\"\
        preformatted panel\" style=\"border-width: 1px;\"><div class=\"preformattedContent\
        \ panelContent\">\n<pre>    Directory dir = newDirectory();\n    RandomIndexWriter\
        \ iw = new RandomIndexWriter(random(), dir);\n    FieldType customType = new\
        \ FieldType(TextField.TYPE_NOT_STORED);\n    customType.setOmitNorms(true);\n\
        \    Field f = new Field(\"body\", \"\", customType);\n    Document doc =\
        \ new Document();\n    doc.add(f);\n    f.setStringValue(\"one quick fox\"\
        );\n    iw.addDocument(doc);\n    IndexReader ir = iw.getReader();\n    iw.close();\n\
        \    IndexSearcher is = newSearcher(ir);\n    \n    PhraseQuery pq = new PhraseQuery();\n\
        \    pq.add(new Term(\"body\", \"quick\"), 0);\n    pq.add(new Term(\"body\"\
        , \"fox\"), 1);\n    System.out.println(is.search(pq, 1).totalHits); // 1\n\
        \n    pq = new PhraseQuery();\n    pq.add(new Term(\"body\", \"quick\"), 10);\n\
        \    pq.add(new Term(\"body\", \"fox\"), 11);\n    System.out.println(is.search(pq,\
        \ 1).totalHits); // 0\n    \n    pq = new PhraseQuery();\n    pq.add(new Term(\"\
        body\", \"quick\"), 10);\n    System.out.println(is.search(pq, 1).totalHits);\
        \ // 1\n    \n    pq = new PhraseQuery();\n    pq.add(new Term(\"body\", \"\
        quick\"), 10);\n    pq.add(new Term(\"body\", \"fox\"), 11);\n    pq.setSlop(1);\n\
        \    System.out.println(is.search(pq, 1).totalHits); // 1\n    \n    ir.close();\n\
        \    dir.close();\n</pre>\n</div></div>\n\n<p>The reason is that when you\
        \ add a term with position P on a PhraseQuery, ExactPhraseScorer ignores all\
        \ positions for this term which are less than P.</p>\n\n<p>But this is inconsistent:</p>\n\
        <ul class=\"alternate\" type=\"square\">\n\t<li>if you have a single term,\
        \ it does not work anymore since we rewrite to a term query regardless of\
        \ the position of the term (3rd query)</li>\n\t<li>if you increase the slop,\
        \ we will use SloppyPhraseScorer which does not have this behaviour. (4th\
        \ query)</li>\n</ul>\n\n\n<p>So I think we have two options:</p>\n<ul class=\"\
        alternate\" type=\"square\">\n\t<li>either remove this behaviour and make\
        \ the positions that are provided to PhraseQuery only relative (ie. fix ExactPhraseScorer)</li>\n\
        \t<li>or make it work this way across the board (which means not rewriting\
        \ to a term query when the position is not 0 and fixing SloppyPhraseScorer).</li>\n\
        </ul>"
