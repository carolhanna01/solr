      comments:
        comment:
        - '#text': <p>I am not even sure what the behaviour should be for sloppy phrases
            if we decide on the second option. And I'm concerned it might make the
            implementation more complicated and/or slower.</p>
          '@author': jpountz
          '@created': Wed, 18 Feb 2015 18:49:48 +0000
          '@id': '14326371'
        - '#text': <p>I think exact PhraseQuery shouldn't support this 'leading wildcards'
            case?  Throw an exc if the user tries to do that?</p>
          '@author': mikemccand
          '@created': Wed, 18 Feb 2015 18:58:25 +0000
          '@id': '14326382'
        - '#text': '<p>Can we avoid throwing an exception to the user?</p>


            <p>I don''t think its their fault if they type "the query", and the search
            engine has a stopword filter in the chain. It will confuse them, they
            dont get an error with "query the". <br/>

            I mean, its still possible to throw it if we really want from the query
            side, but it just makes queryparsers more complicated, because any sane
            parser will want to avoid this explicitly. i really don''t think its the
            right response, and I think its rare enough that people will see that
            response as a bug.</p>'
          '@author': rcmuir
          '@created': Thu, 19 Feb 2015 01:50:44 +0000
          '@id': '14326876'
        - '#text': "<p>Here is a middle ground proposal:</p>\n<ul class=\"alternate\"\
            \ type=\"square\">\n\t<li>enforce that terms are added in order of positions</li>\n\
            \t<li>enforce that positions are all positive</li>\n\t<li>PhraseQuery\
            \ still accepts that the first position is greater than 0 but PhraseWeight\
            \ does not</li>\n\t<li>PhraseQuery.rewrite takes care of rebasing positions\
            \ if the first one is not 0</li>\n</ul>\n\n\n<p>This way, PhraseQuery\
            \ would still be friendly to query parsers that create phrase queries\
            \ from a token stream.</p>"
          '@author': jpountz
          '@created': Thu, 19 Feb 2015 08:55:45 +0000
          '@id': '14327132'
        - '#text': <p>+1</p>
          '@author': rcmuir
          '@created': Thu, 19 Feb 2015 13:03:43 +0000
