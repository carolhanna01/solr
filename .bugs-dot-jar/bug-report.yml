      description: '<p>testpoints used to only be emitted by assertions (still sketchy),
        but now are emitted always. I assume this is due to the change to support
        running tests with assertions disabled.</p>


        <p>we should try to clean this up, simple stuff like this is now useless:</p>

        <div class="code panel" style="border-width: 1px;"><div class="codeContent
        panelContent">

        <pre class="code-java">indexWriterConfig.setInfoStream(<span class="code-object">System</span>.out);

        <span class="code-comment">// causes massive flooding like <span class="code-keyword">this</span>:

        </span><span class="code-comment">// TP 0 [Tue Dec 16 20:19:37 EST 2014; <span
        class="code-object">Thread</span>-0]: DocumentsWriterPerThread addDocument
        start

        </span><span class="code-comment">// TP 0 [Tue Dec 16 20:19:37 EST 2014; <span
        class="code-object">Thread</span>-0]: DocumentsWriterPerThread addDocument
        start

        </span><span class="code-comment">// TP 0 [Tue Dec 16 20:19:37 EST 2014; <span
        class="code-object">Thread</span>-0]: DocumentsWriterPerThread addDocument
        start</span>

        </pre>

        </div></div>


        <p>I hit this several times today just trying to do benchmarks and debugging.</p>'
