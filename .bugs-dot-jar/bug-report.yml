      description: "<p>Tripped by the new random sim from <a href=\"https://issues.apache.org/jira/browse/LUCENE-4297\"\
        \ title=\"BooleanScorer2 sometimes multiplies coord() twice into the score\"\
        \ class=\"issue-link\" data-issue-key=\"LUCENE-4297\"><del>LUCENE-4297</del></a>:</p>\n\
        \n<p>The basics are this:</p>\n<ul>\n\t<li>BooleanQuery has the following\
        \ rewrite():\n<div class=\"code panel\" style=\"border-width: 1px;\"><div\
        \ class=\"codeContent panelContent\">\n<pre class=\"code-java\">  <span class=\"\
        code-keyword\">public</span> Query rewrite(IndexReader reader) <span class=\"\
        code-keyword\">throws</span> IOException {\n    <span class=\"code-keyword\"\
        >if</span> (minNrShouldMatch == 0 &amp;&amp; clauses.size() == 1) {      \
        \              <span class=\"code-comment\">// optimize 1-clause queries</span>\n\
        </pre>\n</div></div></li>\n</ul>\n\n\n<ul>\n\t<li>you have a coord() impl\
        \ that doesnt return 1.0 if overlap == maxOverlap, particularly:\n<div class=\"\
        code panel\" style=\"border-width: 1px;\"><div class=\"codeContent panelContent\"\
        >\n<pre class=\"code-java\"><span class=\"code-keyword\">return</span> overlap\
        \ / ((<span class=\"code-object\">float</span>)maxOverlap + 1);\n</pre>\n\
        </div></div></li>\n</ul>\n\n\n<ul>\n\t<li>TestBooleanMinShouldMatch.testRandomQueries\
        \ generates random boolean queries (Q1), then compares the scores of the random\
        \ query to the same query but with minNrShouldmatch applied to its should\
        \ clauses (Q2)</li>\n</ul>\n\n\n<ul>\n\t<li>in the case of a single term BQ,\
        \ the rewrite applies to Q1, making it a term query, but not to Q2. so the\
        \ coord() only gets called for Q2, not Q1. and with this crazy coord it means\
        \ the scores are different.</li>\n</ul>\n\n\n<p>I think the rewrite is wrong,\
        \ we should also rewrite single-query BQs where minNrShouldMatch = 1 and there\
        \ is a single optional clause.</p>"
