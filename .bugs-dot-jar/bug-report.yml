      comments:
        comment:
        - '#text': '<p>Here is a patch.</p>


            <p>This adds a package private boolean ''enableTestPoints'' to IndexWriter.
            We don''t base it on assertion status or any of that, you only want test
            points if you are one of the few special tests asking for them.</p>


            <p>I refactored all tests to use the RandomIndexWriter.mockIndexWriter
            for registering listeners at test points, and this sets the necessary
            boolean for you on IW.</p>


            <p>I also added simple tests ensuring that test points are only output
            when we ask for them.</p>'
          '@author': rcmuir
          '@created': Wed, 17 Dec 2014 05:34:21 +0000
          '@id': '14249504'
        - '#text': <p>+1, thanks Rob!</p>
          '@author': mikemccand
          '@created': Wed, 17 Dec 2014 10:02:42 +0000
