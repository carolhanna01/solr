        - '#text': <p>Thanks for reporting <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=markus17"
            class="user-hover" rel="markus17">markus17</a> - it's a leftover from
            <a href="https://issues.apache.org/jira/browse/LUCENE-6228" title="Do
            not expose full-fledged scorers in LeafCollector.setScorer" class="issue-link"
            data-issue-key="LUCENE-6228"><del>LUCENE-6228</del></a>, we should be
            casting to a <tt>Scorable</tt> instead of a <tt>Scorer</tt>. I'll put
            up a patch.</p>
          '@author': romseygeek
          '@created': Wed, 27 Mar 2019 15:39:10 +0000
