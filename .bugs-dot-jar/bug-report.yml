      description: "<p>I set up a SolrCloud with 2 nodes and enabled basic auth following\
        \ the Solr guide (<a href=\"https://solr.apache.org/guide/solr/latest/deployment-guide/basic-authentication-plugin.html#enable-basic-authentication\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://solr.apache.org/guide/solr/latest/deployment-guide/basic-authentication-plugin.html#enable-basic-authentication</a>).</p>\n\
        <div class=\"preformatted panel\" style=\"border-width: 1px;\"><div class=\"\
        preformattedContent panelContent\">\n<pre>ERROR (qtp1527086220-49) [] o.a.s.h.RequestHandlerBase\
        \ java.lang.NullPointerException =&gt; java.lang.NullPointerException\nat\
        \ org.apache.solr.security.RuleBasedAuthorizationPluginBase.getPermissionNamesForRoles(RuleBasedAuthorizationPluginBase.java:123)\n\
        java.lang.NullPointerException: null\nat org.apache.solr.security.RuleBasedAuthorizationPluginBase.getPermissionNamesForRoles(RuleBasedAuthorizationPluginBase.java:123)\
        \ ~[?:?]\nat org.apache.solr.handler.admin.SystemInfoHandler.getSecurityInfo(SystemInfoHandler.java:342)\
        \ ~[?:?]\nat org.apache.solr.handler.admin.SystemInfoHandler.handleRequestBody(SystemInfoHandler.java:153)\
        \ ~[?:?]\n</pre>\n</div></div>\n<p>Logs seen on the Solr node originating\
        \ the request:</p>\n<div class=\"preformatted panel\" style=\"border-width:\
        \ 1px;\"><div class=\"preformattedContent panelContent\">\n<pre>2022-11-04\
        \ 09:26:46.251 INFO  (qtp1658512704-126) [] o.a.s.s.HttpSolrCall [admin] webapp=null\
        \ path=/admin/info/system params={wt=javabin&amp;version=2&amp;_=1667579206203}\
        \ status=0 QTime=1\n2022-11-04 09:26:46.259 WARN  (qtp1658512704-81) [] o.a.s.h.a.AdminHandlersProxy\
        \ Exception when fetching result from node localhost:6564_solr =&gt; java.util.concurrent.ExecutionException:\
        \ org.apache.solr.client.solrj.impl.BaseHttpSolrClient$RemoteSolrException:\
        \ Error from server at http://localhost:6564/solr: java.lang.NullPointerException\n\
        at org.apache.solr.security.RuleBasedAuthorizationPluginBase.getPermissionNamesForRoles(RuleBasedAuthorizationPluginBase.java:126)\n\
        java.util.concurrent.ExecutionException: org.apache.solr.client.solrj.impl.BaseHttpSolrClient$RemoteSolrException:\
        \ Error from server at http://localhost:6564/solr: java.lang.NullPointerException\n\
        </pre>\n</div></div>\n<p>\_</p>\n\n<p>I believe the reason is the 'roles'\
        \ set is null on inter-node requests so this method will throw a NPE <a href=\"\
        https://github.com/apache/solr/blob/26195c82493422cb9d6d4bdf9d4452046e7b3f67/solr/core/src/java/org/apache/solr/security/RuleBasedAuthorizationPluginBase.java#L122\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://github.com/apache/solr/blob/26195c82493422cb9d6d4bdf9d4452046e7b3f67/solr/core/src/java/org/apache/solr/security/RuleBasedAuthorizationPluginBase.java#L122</a></p>\n\
        \n<p>\_</p>\n\n<p>It looks like this was introduced with following commit\
        \ for <a href=\"https://issues.apache.org/jira/browse/SOLR-15776\" title=\"\
        Make Admin UI play well with Authorization\" class=\"issue-link\" data-issue-key=\"\
        SOLR-15776\"><del>SOLR-15776</del></a> <a href=\"https://github.com/apache/solr/commit/a1406847ba256965e636e05b11e53c0ac696e2a9#diff-83579b1681fbe3ea47f7340796963b034594921405afb41c62d9415f52f5adcfR356\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://github.com/apache/solr/commit/a1406847ba256965e636e05b11e53c0ac696e2a9#diff-83579b1681fbe3ea47f7340796963b034594921405afb41c62d9415f52f5adcfR356</a></p>"
