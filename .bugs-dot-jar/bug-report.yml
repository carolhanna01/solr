          '@author': jira-bot
          '@created': Wed, 1 Mar 2017 06:42:32 +0000
          '@id': '15889612'
        - '#text': <p>Closing.  I'll create a linked follow-up bug issue for WildcardQuery
            (also applies to Regexp) where we can discuss how to deal with that &#8211;
            the more overall fix.  I don't think that one should hold up a 6.4.2.  It'll
            likely result in removing the PrefixQuery and TermRangeQuery sections
            in MultiTermHighlighting.</p>
          '@author': dsmiley
          '@created': Wed, 1 Mar 2017 06:51:35 +0000
          '@id': '15889638'
        - '#text': "<p>Hello Christine<br/>\nI saw your test. I think that </p>\n\
            <ul class=\"alternate\" type=\"square\">\n\t<li>\"I\" is not suitable\
            \ data for test, because StandardAnalyzer converts data to lower case\
            \ (but PrefixQuery doesn't)</li>\n\t<li>why \"random\"? \u0421ould be\
            \ better make text array String[] texts = \n{\"i\", \"\u044F\", }\n<p>\
            \ and run for each?</p></li>\n\t<li>and I mean that result should be,\
            \ for example, \"&lt;b&gt;q&lt;/b&gt;\" for data \"q\" and query \"q*\"\
            \ and so on for multi-byte data (assertEquals(\"&lt;b&gt;\"<ins>text</ins>\"\
            &lt;/b&gt;\", snippetString)<img class=\"emoticon\" src=\"https://issues.apache.org/jira/images/icons/emoticons/wink.png\"\
            \ height=\"16\" width=\"16\" align=\"absmiddle\" alt=\"\" border=\"0\"\
            /><br/>\nBest regards</li>\n</ul>"
          '@author': dmitrymalinin
          '@created': Thu, 2 Mar 2017 07:38:38 +0000
          '@id': '15891753'
