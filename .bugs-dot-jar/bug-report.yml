      description: '<p>There are two major problems:<br/>

        1. The listener api does not really apply all indexreaders. for example segmentreaders
        dont fire it on close, only segmentcorereaders. this is wrong, a segmentcorereader
        is <b>not</b> an indexreader. Furthermore, if you register it on a top-level
        reader you get events for anything under the reader tree (sometimes, unless
        they are segmentreaders as mentioned above, where it doesnt work correctly
        at all).<br/>

        2. Furthermore your listener is ''passed along'' in a viral fashion from clone()
        and reopen(). This means for example, if you are trying to listen to readers
        in NRT search you are just accumulating reader listeners, all potentially
        keeping references to old indexreaders (because, in order to deal with #1
        your listener must ''keep'' a reference to the IR it was registered on, so
        it can check if thats <b>really</b> the one).</p>


        <p>We should discuss how to fix #1. </p>


        <p>I will create a patch for #2 shortly and commit it, its just plain wrong.</p>'
