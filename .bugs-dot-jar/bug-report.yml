      description: <p>As a side effect from <a href="https://issues.apache.org/jira/browse/LUCENE-5859"
        title="Remove Version from Analyzer constructors" class="issue-link" data-issue-key="LUCENE-5859"><del>LUCENE-5859</del></a>,
        <tt>Lucene43NGramTokenizer</tt> was made not final.  This can trip an assert
        we have that <tt>Tokenizer</tt> need to either be final, or have their <tt>incrementToken()</tt>
        function be final.</p>
