      comments:
        comment:
        - '#text': '<p>Hi,</p>


            <p>+1, I was f*cking with this the whole day when rewriting oirectoryReader/MultiReader.</p>


            <p>The bad thing is also that the Set(CHM) is not initialized in IndexReader
            base class (and is not final), the subclasses must do it. This should
            be done by base class and be protected final, then normal IndexReaders
            dont need to f*ck with it. Just make the listeners collection in IndexReader
            base class final and initialize with MapBackedSet(CHM).<br/>

            DirectoryReader and other MultiReaders may simply delegate the registration
            to the subreaders, but dont pass sets around. If they need to copy all,
            just do "for (Listener l: this.listenerss) subreader<span class="error">&#91;i&#93;</span>.add(l);",
            sharing the same map between different readers is wrong.</p>'
          '@author': thetaphi
          '@created': Tue, 13 Dec 2011 13:04:47 +0000
          '@id': '13168351'
        - '#text': '<p>The original intention of this API (<a href="https://issues.apache.org/jira/browse/LUCENE-2474"
            title="Allow to plug in a Cache Eviction Listener to IndexReader to eagerly
            clean custom caches that use the IndexReader (getFieldCacheKey)" class="issue-link"
            data-issue-key="LUCENE-2474"><del>LUCENE-2474</del></a>) was in fact to
            detect<br/>

            only when a SegmentCoreReader was closed, so that "external" caches<br/>

            the app kept could be purged, and not really to detect closing of all<br/>

            other readers (eg composite readers).</p>


            <p>But I agree, we should somehow generalize this to do both<br/>

            functions...</p>'
          '@author': mikemccand
          '@created': Tue, 13 Dec 2011 13:33:50 +0000
          '@id': '13168373'
        - '#text': '<p>I think thats confusing, I think if you set the listener on
            a reader, it should work.</p>


            <p>If we want a <b>core</b> listener, it should be a separate thing! and
            we can have a clean API for that,<br/>

            specific to SR (Maybe even only on SR itself!) that doesn''t confuse the
            other case</p>'
          '@author': rcmuir
          '@created': Tue, 13 Dec 2011 13:38:14 +0000
          '@id': '13168378'
        - '#text': '<p>That''s a good idea: separate APIs for "core closed event"
            and "composite reader closed event".</p>'
          '@author': mikemccand
          '@created': Tue, 13 Dec 2011 13:50:11 +0000
          '@id': '13168386'
        - '#text': '<blockquote>

            <p>That''s a good idea: separate APIs for "core closed event" and "composite
            reader closed event".</p></blockquote>


            <p>Thats not really what i''m saying though.</p>


            <p>I think readerFinishedListener, since its on indexreader, should fire
            when an IndexReader closes.<br/>

            I dont care if its composite or not. Its an indexreader, thats all we
            care about.</p>


            <p>Then core closed event naturally makes sense on SegmentReader, because
            its the only one that <br/>

            cares/knows about cores.</p>'
          '@author': rcmuir
          '@created': Tue, 13 Dec 2011 14:00:04 +0000
          '@id': '13168391'
        - '#text': <p>I hate the whole thing, sorry. Please remove it,... completely.</p>
          '@author': thetaphi
          '@created': Tue, 13 Dec 2011 14:02:34 +0000
          '@id': '13168393'
        - '#text': <p>And "ReaderFinished" is wrong word, it is "ReaderClosed". Finished
            sounds more like "Ready" than like "Close", its misunderstanding. I heard
            of that shit the first time last weekend and was teriified. Who proposed
            it, I will kill him/her?</p>
          '@author': thetaphi
          '@created': Tue, 13 Dec 2011 14:07:22 +0000
          '@id': '13168396'
        - '#text': <p>Sorry for the last comment, I am still in rage, rage against
            this... aaaaah ! <img class="emoticon" src="https://issues.apache.org/jira/images/icons/emoticons/sad.png"
            height="16" width="16" align="absmiddle" alt="" border="0"/> die, die,
            die!</p>
          '@author': thetaphi
          '@created': Tue, 13 Dec 2011 14:09:18 +0000
          '@id': '13168398'
        - '#text': "<p>attached is a patch, cleaning this up. All tests pass.</p>\n\
            \n<p>The two use cases are now totally separated instead of being confusingly\
            \ and dangerously interwoven. I also renamed things per uwe's advice:</p>\n\
            \n<ul>\n\t<li>IndexReader's ReaderClosedListener does exactly what it\
            \ says. It fires when readers close. This is used to e.g. evict top-level\
            \ fieldcaches.</li>\n\t<li>SegmentReader's CoreClosedListener fires when\
            \ the shared core is closed. This is used to e.g. evict per-segment fieldcaches.</li>\n\
            </ul>"
          '@author': rcmuir
          '@created': Tue, 13 Dec 2011 15:12:18 +0000
          '@id': '13168420'
        - '#text': <p>updated patch, with a stupid optimization for when you have
            field cache on top-level readers and also insanity.</p>
          '@author': rcmuir
          '@created': Tue, 13 Dec 2011 15:45:50 +0000
          '@id': '13168455'
        - '#text': '<p>Patch looks great!  I love the separation into "reader closed"
            vs "core closed", and removing all that hairy code that was copying around
            the previously registered listeners... MUCH simpler.</p>


            <p>But: I don''t think we should "forward to subs" when someone registers
            for reader closed?  I think if you register you should only be notified
            when that exact reader is closed?  If somehow you care about the subs
            (I think this is the exception not the rule) you can always pull them
            and register with them too.</p>'
          '@author': mikemccand
          '@created': Tue, 13 Dec 2011 16:21:40 +0000
          '@id': '13168475'
        - '#text': '<p>Hi, I am happy with the code now, but I still hate the (Event-)Listener-pattern.
            In a library like Lucene its very "foreign", it fits much better to GUIs
            with event loops <img class="emoticon" src="https://issues.apache.org/jira/images/icons/emoticons/smile.png"
            height="16" width="16" align="absmiddle" alt="" border="0"/></p>


            <p>And thanks for renaming the Listener!</p>'
          '@author': thetaphi
          '@created': Tue, 13 Dec 2011 16:28:52 +0000
          '@id': '13168482'
        - '#text': '<blockquote>

            <p>But: I don''t think we should "forward to subs" when someone registers
            for reader closed? I think if you register you should only be notified
            when that exact reader is closed?</p></blockquote>


            <p>I agree, the only two real uses of this api we have today (as of the
            previous patch), both jump thru hoops to avoid this. Here''s a patch implementing
            it that way (much cleaner imo)</p>'
          '@author': rcmuir
          '@created': Tue, 13 Dec 2011 19:20:42 +0000
          '@id': '13168630'
        - '#text': <p>+1 looks great!</p>
          '@author': mikemccand
          '@created': Tue, 13 Dec 2011 19:31:48 +0000
          '@id': '13168643'
        - '#text': '<p>I just saw this thread, and would like to respond to @Uwe as
            I think he is completely wrong here. Its perfectly fine to have listeners
            in this case. If you are implementing a cache based on core readers (think
            custom filter cache for example), its basically the only sane way to do
            it (and not have to handle weak references which is bad on GC and error
            prone with complex keys). And Lucene should allow for that.</p>


            <p>I don''t think the separation to segment core listener and index reader
            listener is the best solution here, since it exposes "too much info" to
            the user (having to deal with different reader cases, check FieldCacheImpl
            for example). I don''t really mind it, since in my case I only work on
            low level Segment case (which is the sane way to work when you do NRT)
            and can handle it, but not sure its best in a general usability wise case.
            What the user want is: here is a reader, which I cache base on it, and
            here is a listener, call me back when that listener is no longer valid.</p>'
          '@author': kimchy
          '@created': Sat, 7 Jan 2012 20:21:58 +0000
          '@id': '13182082'
        - '#text': '<p>This issue was moved to GitHub issue: <a href="https://github.com/apache/lucene/issues/4718"
            class="external-link" target="_blank" rel="nofollow noopener">#4718</a>.</p>'
          '@author': tomoko uchida
          '@created': Sun, 28 Aug 2022 13:03:49 +0000
          '@id': '17589850'
