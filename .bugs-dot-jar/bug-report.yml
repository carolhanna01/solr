      comments:
        comment:
        - '#text': '<p>I think that in org.apache.lucene.search.uhighlight.MultiTermHighlighting.extractAutomata()<br/>

            condition "if (query instanceof AutomatonQuery)" should be the last in
            "if" chain</p>'
          '@author': dmitrymalinin
          '@created': Tue, 28 Feb 2017 13:11:04 +0000
          '@id': '15887968'
        - '#text': <p>Hello Dmitry. - I am attaching potential test case adapted from
            your code snippet (no pun intended) in the description. The test passes
            locally for me though. Could you perhaps try running it locally too and
            adapt/adjust it and with/without the MultiTermHighlighting change you
            mention? Thanks. - Christine</p>
          '@author': cpoerschke
          '@created': Tue, 28 Feb 2017 17:06:57 +0000
          '@id': '15888457'
        - '#text': '<p>At some point <em>after</em> MultiTermHighlighting.java was
            first written, PrefixQuery was altered to be a subclass of AutomatonQuery.  So
            PrefixQuery detection could simply be removed now, I think, since it''s
            handled via AutomatonQuery condition.</p>


            <p>I''m working on debugging to see <em>why</em> this fails &amp; a proper
            test.  (the test would go in TestUnifiedHighlighterMTQ by the way)</p>'
          '@author': dsmiley
          '@created': Tue, 28 Feb 2017 17:09:20 +0000
          '@id': '15888464'
        - '#text': "<p>Here's my take on it:  The UnifiedHighlighter (and PostingsHighlighter\
            \ from which it derives) processes the MultiTermQueries (e.g. wildcards)\
            \ in the query and creates multiple <tt>CharacterRunAutomaton</tt> intended\
            \ to match the same things.  <tt>CharacterRunAutomaton</tt> takes a <tt>Automaton</tt>\
            \ as input, and when it does it's processing, it matches the Character\
            \ code points (integers from 0 to 0x10FFFF) against the integers in the\
            \ Automaton.  However, this strategy assumes that the Automaton was constructed\
            \ based on character code points.  But <tt>AutomatonQuery.getAutomaton</tt>\
            \ is intended to match byte by byte (integers 0 to 255).  <tt>PrefixQuery.toAutomaton</tt>\
            \ will get 2 bytes for the the \"\u044F\" in BytesRef form, and add 2\
            \ states.  This does not line up with the assumptions of CharacterRunAutomaton.</p>\n\
            \n<p>A short term immediate \"fix\" is simply to put AutomatonQuery last\
            \ in the if-else list as Dmitry indicated.  As such, PrefixQuery will\
            \ work again.  This was broken by <a href=\"https://issues.apache.org/jira/browse/LUCENE-6367\"\
            \ title=\"Can PrefixQuery subclass AutomatonQuery?\" class=\"issue-link\"\
            \ data-issue-key=\"LUCENE-6367\"><del>LUCENE-6367</del></a> (Lucene 5.1).\
            \  TermRangeQuery, which also now extends AutomatonQuery, will likewise\
            \ work &#8211; broken by <a href=\"https://issues.apache.org/jira/browse/LUCENE-5879\"\
            \ title=\"Add auto-prefix terms to block tree terms dict\" class=\"issue-link\"\
            \ data-issue-key=\"LUCENE-5879\"><del>LUCENE-5879</del></a> (Lucene 5.2).\
            \  Again, back when MultiTermHighlighting was first written, neither of\
            \ those queries extended AutomatonQuery.  <em>But there will be bugs for\
            \ other types of AutomatonQuery (namely WildcardQuery and RegexpQuery)\
            \ that have yet to be reported.</em></p>\n\n<p><a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=rcmuir\"\
            \ class=\"user-hover\" rel=\"rcmuir\">rcmuir</a> or <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=mikemccand\"\
            \ class=\"user-hover\" rel=\"mikemccand\">mikemccand</a> I wonder if you\
            \ have any thoughts on how to fix this.  An idea I have is to <em>not</em>\
            \ use a CharacterRunAutomaton in the UnifiedHighlighter; use a ByteRunAutomaton\
            \ instead.  Then, add <tt>ByteRunAutomaton.run(char[] ...etc)</tt> that\
            \ converts each character to the equivalent UTF8 bytes to match.  Even\
            \ with that, I wonder if this points to areas to improve the automata\
            \ API so that people don't bump into this trap in the future.  For example,\
            \ maybe have the Automata self-report if it's byte oriented, Unicode codepoint\
            \ oriented, or something custom.  Then, RunAutomaton could throw an exception\
            \ if there is a mis-match.  However that would be a runtime error; maybe\
            \ the Automata could be typed.</p>\n\n<p>Any way, what I'd like to do\
            \ is do a short term fix that addresses many common cases and the title\
            \ of this issue.  And then do a more thorough fix in a follow-on issue.\
            \  <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=ichattopadhyaya\"\
            \ class=\"user-hover\" rel=\"ichattopadhyaya\">ichattopadhyaya</a> do\
            \ you think this could go into 6.4.2 or are you only looking for \"critical\"\
            \ issues?  It's debatable what's critical and not.  This bug has been\
            \ around since 5.1 so perhaps it isn't.</p>\n\n<p>(a patch will follow\
            \ shortly)</p>"
          '@author': dsmiley
          '@created': Tue, 28 Feb 2017 20:22:05 +0000
          '@id': '15888807'
        - '#text': <p>Here's a patch. It fixed the MultiTermHighlighting class in
            both the <tt>postingshighlight</tt> package as well as <tt>uhighlight</tt>.  It
            adds a test method to <tt>TestUnifiedHighlighterMTQ</tt>.  I also beefed
            up the test for a related method <tt>testWhichMTQMatched</tt> to avoid
            potential inadvertent changes to the CharRunAutomata toString that people
            might depend on.  It appears there was no breakage in this case but until
            I added more query types, wether it did or didn't break wasn't apparent.</p>
          '@author': dsmiley
          '@created': Tue, 28 Feb 2017 20:41:51 +0000
          '@id': '15888833'
        - '#text': <p>IntelliJ IDEA has clued me into this else-if having dead code
            paths for a long while now here and I'm kicking myself for putting it
            off &#8211; LOL.</p>
          '@author': dsmiley
          '@created': Tue, 28 Feb 2017 20:54:14 +0000
          '@id': '15888849'
        - '#text': <p><a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=dsmiley"
            class="user-hover" rel="dsmiley">dsmiley</a>, I don't mind including this
            fix, if you think this is a low risk fix and should be included. Feel
            free to backport this one to the release branch. I'm anyway waiting for
            <a href="https://issues.apache.org/jira/browse/SOLR-10215" title="Cannot
            use the namenode for HDFS HA as of Solr 6.4" class="issue-link" data-issue-key="SOLR-10215"><del>SOLR-10215</del></a>
            as of now.</p>
          '@author': ichattopadhyaya
          '@created': Tue, 28 Feb 2017 22:02:49 +0000
          '@id': '15888945'
