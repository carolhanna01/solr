      description: '<p>This bug was previously masked by <a href="https://issues.apache.org/jira/browse/LUCENE-5768"
        title="hunspell condition check is buggy" class="issue-link" data-issue-key="LUCENE-5768"><del>LUCENE-5768</del></a>.</p>


        <p>Basically ''-'' doesnt mean anything special (e.g. what it normally means
        for a regex), so we usually have to escape it. but some dictionaries like
        pt_PT already escape it, so now that our parsing works correctly, we are undoing
        that and creating a bad condition.</p>'
