      description: "<p>here is why this test sometimes fails (my explanation in the\
        \ test i wrote):</p>\n\n<div class=\"preformatted panel\" style=\"border-width:\
        \ 1px;\"><div class=\"preformattedContent panelContent\">\n<pre>  /** make\
        \ sure all sims work with spanOR(termX, termY) where termY does not exist\
        \ */\n  public void testCrazySpans() throws Exception {\n    // The problem:\
        \ \"normal\" lucene queries create scorers, returning null if terms dont exist\n\
        \    // This means they never score a term that does not exist.\n    // however\
        \ with spans, there is only one scorer for the whole hierarchy:\n    // inner\
        \ queries are not real queries, their boosts are ignored, etc.\n</pre>\n</div></div>\n\
        \n<p>Basically, SpanQueries aren't really queries, you just get one scorer.\
        \ it calls extractTerms on the whole hierarchy and computes weights (e.g.\
        \ IDF) on<br/>\nthe whole bag of terms, even if they don't exist.</p>\n\n\
        <p>This is fine, we already have tests that sim's won't bug-out in computeStats()\
        \ here: however they don't expect to actually score documents based on<br/>\n\
        these terms that don't exist... however this is exactly what happens in Spans\
        \ because it doesn't use sub-scorers.</p>\n\n<p>Lucene's sim avoids this with\
        \ the (docFreq + 1)</p>"
